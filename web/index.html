<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProtoBot</title>
<!-- Same robot as the #logo symbol; data URI because the server serves no static files. Colors follow the OS theme. -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='440 60 656 562'%3E%3Cstyle%3E.f%7Bfill:%231d1d1b%7D.b%7Bfill:%23fff%7D@media (prefers-color-scheme:dark)%7B.f%7Bfill:%23ececea%7D.b%7Bfill:%231f1f1d%7D%7D%3C/style%3E%3Cg class='f'%3E%3Ccircle cx='768' cy='105' r='35'/%3E%3Crect x='757' y='132' width='22' height='63'/%3E%3Cpath d='M701 230 A67 67 0 0 1 835 230 Z'/%3E%3Cpath d='M495 310 H479 Q449 310 449 340 V414 Q449 444 479 444 H495 Z'/%3E%3Cpath d='M1041 310 H1057 Q1087 310 1087 340 V414 Q1087 444 1057 444 H1041 Z'/%3E%3Crect x='505' y='223' width='526' height='302' rx='83'/%3E%3C/g%3E%3Crect class='b' x='529' y='247' width='478' height='254' rx='60'/%3E%3Cg class='f'%3E%3Ccircle cx='657' cy='379' r='85'/%3E%3Ccircle cx='883' cy='379' r='85'/%3E%3Crect x='703' y='512' width='130' height='34'/%3E%3Cpath d='M674 558 H862 Q876 558 883 573 L897 602 Q901 613 889 613 H648 Q635 613 640 601 L653 573 Q659 558 674 558 Z'/%3E%3C/g%3E%3Cg class='b'%3E%3Cpath fill-rule='evenodd' d='M657 333 C635 333 622 352 622 379 C622 408 634 427 657 427 C680 427 693 408 693 379 C693 352 680 333 657 333 Z M657 353 C649 353 646 362 646 379 C646 397 649 407 657 407 C665 407 669 397 669 379 C669 362 665 353 657 353 Z'/%3E%3Cpath d='M874 336 H897 V411 H914 V427 H854 V411 H873 V361 L856 372 V352 Z'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
  /* Light only for now (design "Agents Layouts", direction 1a/1b). */
  :root { --side:#f7f8f9; --surface:#fff; --fg:#16181b; --fg2:#2a2e33; --muted:#4d535b; --faint:#6b717a;
          --ghost:#9aa0a7; --line:#e5e7ea; --line2:#eef0f2; --line3:#d5d8dc; --chip:#eef0f2; --soft:#f1f3f5;
          --sel:#e9ebee; --ink:#1c1c1c; --ok:#2f9e5f; --ok-fg:#2a7f4f; --bad:#c2362b; --warn:#b7791f;
          --sans: Geist, ui-sans-serif, system-ui, sans-serif; --mono: "Geist Mono", ui-monospace, Consolas, monospace;
          color-scheme: light; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; } /* author display rules would otherwise override the hidden attribute */
  body { margin:0; font:14px/1.5 var(--sans); background:var(--surface); color:var(--fg); -webkit-font-smoothing:antialiased; }
  button, input, textarea, select { font:inherit; color:inherit; }
  button { cursor:pointer; }
  .mono { font-family:var(--mono); }
  .logo { width:22px; height:22px; flex:none; --logo-bg:var(--side); }

  /* buttons and inputs */
  .btn { height:32px; display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:0 12px;
         border:1px solid var(--line3); border-radius:8px; background:var(--surface); font-size:13px; font-weight:500; white-space:nowrap; }
  .btn:hover { background:var(--side); }
  .btn.primary { background:var(--ink); border-color:var(--ink); color:#fff; }
  .btn.primary:hover { background:#33363a; }
  .btn.danger { background:var(--bad); border-color:var(--bad); color:#fff; }
  .btn:disabled { opacity:.5; cursor:default; }
  .icon-btn { width:32px; height:32px; display:grid; place-items:center; border:1px solid var(--line); border-radius:8px; background:var(--surface); font-size:15px; padding:0; }
  .link { border:0; background:none; padding:0; font-size:13px; color:var(--muted); }
  .link:hover { color:var(--fg); text-decoration:underline; text-underline-offset:3px; }
  .link.bad { color:var(--bad); }
  .play { width:0; height:0; border-left:7px solid currentColor; border-top:4.5px solid transparent; border-bottom:4.5px solid transparent; }
  input[type=text], input[type=password], input[type=number], input[type=time], input[type=datetime-local], textarea {
    width:100%; border:1px solid var(--line3); border-radius:8px; background:var(--surface); padding:8px 10px; outline:none; }
  input:focus, textarea:focus { border-color:var(--ink); }
  textarea { resize:vertical; }
  .err { color:var(--bad); font-size:13px; }
  .err:empty { display:none; }

  .switch { width:30px; height:18px; flex:none; display:flex; align-items:center; padding:0 2px; border:0; border-radius:999px; background:var(--line3); }
  .switch::after { content:""; width:14px; height:14px; border-radius:50%; background:#fff; transition:transform .15s; }
  .switch[aria-checked=true] { background:var(--ink); }
  .switch[aria-checked=true]::after { transform:translateX(12px); }

  .avatar { width:28px; height:28px; flex:none; display:grid; place-items:center; border-radius:7px; background:var(--chip);
            font:500 10.5px var(--mono); color:var(--muted); text-transform:uppercase; }
  .dot { width:7px; height:7px; flex:none; border-radius:50%; background:var(--ok); box-shadow:inset 0 0 0 1.5px var(--ok); }
  .dot.paused { background:transparent; box-shadow:inset 0 0 0 1.5px var(--ghost); }
  .dot.busy { background:var(--warn); box-shadow:inset 0 0 0 1.5px var(--warn); }
  .meta { font:500 11.5px var(--mono); color:var(--faint); }

  /* layout */
  .app { display:grid; grid-template-columns:248px minmax(0, 1fr); height:100dvh; }
  .side { display:flex; flex-direction:column; gap:12px; padding:16px 12px; background:var(--side); border-right:1px solid var(--line); min-height:0; }
  .brand { display:flex; align-items:center; gap:8px; padding:2px 6px; font-size:14px; font-weight:600; }
  .brand .grow { flex:1; }
  #btnNewAgentM { display:none; }
  #agents { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px; overflow:auto; min-height:0; }
  #agents a { display:flex; align-items:center; gap:10px; padding:7px 8px; border-radius:8px; border:1px solid transparent; color:inherit; text-decoration:none; }
  #agents a:hover { background:var(--sel); }
  #agents a.sel { background:var(--surface); border-color:var(--line); }
  #agents .txt { flex:1; min-width:0; display:flex; flex-direction:column; gap:1px; }
  #agents .name { font-size:13.5px; font-weight:450; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #agents a.sel .name { font-weight:600; }
  #agents .desc { display:none; }
  #agents .right { display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
  #agents .right .meta { display:none; }

  .page { display:flex; flex-direction:column; min-width:0; min-height:0; }
  .ahead { padding:24px 40px 0; border-bottom:1px solid var(--line); }
  .ahead-row { display:flex; align-items:center; gap:16px; }
  .ahead .avatar { width:44px; height:44px; border-radius:10px; font-size:13px; }
  .ahead .title { flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
  #curName { font-size:22px; font-weight:600; letter-spacing:-0.015em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #curDesc { font-size:14px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .busy-pill { display:flex; align-items:center; gap:6px; height:24px; padding:0 9px; border:1px solid var(--line); border-radius:999px; font:500 11.5px var(--mono); color:var(--warn); }
  .active-box { display:flex; align-items:center; gap:10px; height:34px; padding:0 12px; border:1px solid var(--line); border-radius:8px; font-size:13px; background:var(--surface); }
  #btnBack { display:none; }
  .menu-wrap { position:relative; }
  .menu { position:absolute; right:0; top:calc(100% + 6px); z-index:10; min-width:200px; padding:4px; background:var(--surface); border:1px solid var(--line); border-radius:10px; box-shadow:0 8px 24px rgba(16,24,40,.12); display:flex; flex-direction:column; }
  .menu button { text-align:left; border:0; background:none; padding:8px 10px; border-radius:6px; font-size:13px; }
  .menu button:hover { background:var(--side); }
  .menu small { display:block; color:var(--faint); font-size:12px; }
  .tabs { display:flex; gap:28px; margin-top:20px; font-size:14px; }
  .tabs a { display:flex; gap:6px; padding:0 0 12px; color:var(--muted); text-decoration:none; border-bottom:2px solid transparent; }
  .tabs a.on { color:var(--fg); font-weight:500; border-bottom-color:var(--ink); }
  .tabs .meta { font-weight:400; line-height:1.8; }
  .tab { flex:1; min-height:0; display:flex; flex-direction:column; }

  /* chat */
  #log { flex:1; min-height:0; overflow:auto; padding:24px 32px 8px; }
  #log .col, .composer-wrap .col { width:100%; max-width:680px; margin:0 auto; }
  #log .col { display:flex; flex-direction:column; gap:22px; }
  .m-user { align-self:flex-end; max-width:78%; padding:10px 14px; background:var(--soft); border-radius:12px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .m-agent { display:flex; flex-direction:column; gap:6px; line-height:1.6; }
  .m-agent .body { white-space:pre-wrap; overflow-wrap:anywhere; }
  .m-system { align-self:center; font-size:13px; color:var(--faint); text-align:center; white-space:pre-wrap; }
  .m-job { border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .m-job .jh { display:flex; justify-content:space-between; gap:12px; padding:9px 14px; background:var(--side); border-bottom:1px solid var(--line); font:500 11.5px var(--mono); color:var(--muted); }
  .m-job .body { padding:12px 14px; font-size:13.5px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .empty { color:var(--faint); font-size:13.5px; text-align:center; margin:auto; }
  .composer-wrap { flex:none; padding:12px 32px 20px; }
  .composer { display:flex; flex-direction:column; gap:8px; padding:10px 10px 10px 14px; border:1px solid var(--line3); border-radius:12px; box-shadow:0 1px 2px rgba(16,24,40,.04); }
  .composer:focus-within { border-color:var(--ink); }
  .composer textarea { border:0; padding:2px 0; min-height:24px; max-height:40vh; resize:none; font-size:14px; }
  .composer-row { display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .send { width:30px; height:30px; display:grid; place-items:center; border:0; border-radius:8px; background:var(--ink); color:#fff; font-size:15px; padding:0; }

  /* setup + jobs */
  .scroll { flex:1; min-height:0; overflow:auto; padding:28px 40px; }
  .stack { max-width:720px; display:flex; flex-direction:column; gap:22px; }
  .section { display:flex; flex-direction:column; gap:8px; }
  .section-head { display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
  .section-head b { font-size:13px; font-weight:600; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:8px; }
  .card-row { display:flex; align-items:center; gap:12px; padding:12px; }
  .card-row .txt { flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
  .card-row .txt b { font-size:14px; }
  .card-row .txt span { font-size:13px; color:var(--muted); }
  #prompt { font:12.5px/1.6 var(--mono); color:var(--fg2); min-height:120px; }
  #prompt[readonly] { background:var(--side); }
  .rules { display:flex; flex-direction:column; }
  .rule { display:flex; gap:10px; align-items:flex-start; padding:9px 11px; border-bottom:1px solid var(--line2); font-size:13px; line-height:1.45; }
  .rule .n { font:11.5px/1.65 var(--mono); color:var(--faint); }
  .rule .t { flex:1; overflow-wrap:anywhere; }
  .rule .x { border:0; background:none; color:var(--ghost); padding:0 2px; font-size:15px; line-height:1; }
  .rule .x:hover { color:var(--bad); }
  .rule-add { display:flex; gap:8px; padding:8px 11px; }
  .rule-add .link { padding:1px 0; }
  details.row { border-bottom:1px solid var(--line2); }
  details.row:last-child { border-bottom:0; }
  details.row summary { list-style:none; display:flex; align-items:center; gap:10px; padding:11px 12px; cursor:pointer; font-size:13.5px; }
  details.row summary::-webkit-details-marker { display:none; }
  details.row summary .grow { flex:1; font-weight:500; }
  details.row summary .chev { color:var(--ghost); transition:transform .15s; }
  details.row[open] summary .chev { transform:rotate(90deg); }
  .files { display:flex; flex-direction:column; padding:0 6px 8px; }
  .files button { display:flex; justify-content:space-between; gap:12px; border:0; background:none; padding:6px 8px; border-radius:6px; font:12.5px var(--mono); color:var(--fg2); text-align:left; }
  .files button:hover { background:var(--side); }
  .files .meta { flex:none; }
  .adv { display:grid; grid-template-columns:1fr 1fr; gap:10px 12px; padding:0 12px 12px; font-size:13px; }
  .adv label { display:flex; flex-direction:column; gap:4px; color:var(--muted); }
  .adv .full { grid-column:1 / -1; }
  .adv .actions { grid-column:1 / -1; display:flex; align-items:center; gap:10px; }

  .jobs-head { display:flex; align-items:flex-end; justify-content:space-between; gap:24px; margin-bottom:6px; }
  .jobs-head b { font-size:16px; }
  .jobs-head span { font-size:13.5px; color:var(--muted); }
  .job { display:flex; flex-direction:column; gap:12px; padding:16px 18px; border:1px solid var(--line); border-radius:10px; }
  .job.off { background:var(--side); }
  .job .top { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; }
  .job .top .txt { display:flex; flex-direction:column; gap:4px; min-width:0; }
  .job .top b { font-size:15px; overflow-wrap:anywhere; }
  .job .when { font:12px var(--mono); color:var(--muted); }
  .job .ctl { display:flex; align-items:center; gap:14px; }
  .job .prompt { padding:10px 12px; background:var(--side); border-radius:8px; font:12.5px/1.6 var(--mono); color:var(--fg2); white-space:pre-wrap; overflow-wrap:anywhere; max-height:9.6em; overflow:auto; }
  .job.off .prompt { background:var(--surface); }
  .job .foot { display:flex; align-items:center; flex-wrap:wrap; gap:6px 20px; }
  .job .foot .link { margin-left:auto; }

  /* dialogs */
  dialog { border:0; padding:0; border-radius:14px; width:min(520px, calc(100vw - 32px)); box-shadow:0 20px 60px rgba(16,24,40,.25); color:var(--fg); }
  dialog::backdrop { background:rgba(16,18,22,.36); }
  dialog form, dialog .dbody { display:flex; flex-direction:column; gap:14px; padding:20px; }
  dialog h2 { margin:0; font-size:18px; font-weight:600; }
  dialog p { margin:0; font-size:14px; color:var(--muted); }
  dialog label.f { display:flex; flex-direction:column; gap:6px; font-size:13px; font-weight:500; }
  dialog .hint { font-weight:400; color:var(--faint); font-size:12px; }
  dialog .actions { display:flex; align-items:center; gap:8px; justify-content:flex-end; }
  dialog .actions .left { margin-right:auto; }
  .seg { display:grid; grid-auto-flow:column; grid-auto-columns:1fr; padding:3px; border-radius:10px; background:var(--soft); font-size:13px; }
  .seg label { position:relative; }
  .seg input { position:absolute; opacity:0; inset:0; margin:0; cursor:pointer; }
  .seg span { height:30px; display:grid; place-items:center; border-radius:8px; color:var(--muted); }
  .seg input:checked + span { background:var(--surface); color:var(--fg); font-weight:500; box-shadow:0 1px 2px rgba(16,24,40,.08); }
  .seg input:focus-visible + span { outline:2px solid var(--ink); }
  .days { display:flex; flex-wrap:wrap; gap:6px; }
  .days label { position:relative; }
  .days input { position:absolute; opacity:0; inset:0; margin:0; cursor:pointer; }
  .days span { display:block; padding:4px 10px; border:1px solid var(--line3); border-radius:999px; font-size:12.5px; }
  .days input:checked + span { background:var(--ink); border-color:var(--ink); color:#fff; }
  .days input:focus-visible + span { outline:2px solid var(--ink); outline-offset:1px; }
  label.check { display:flex; align-items:center; gap:8px; font-size:13.5px; }
  #jobPrompt { font:12.5px/1.6 var(--mono); min-height:110px; }
  #fileText { margin:0; max-height:60vh; overflow:auto; padding:12px; background:var(--side); border-radius:8px; font:12.5px/1.6 var(--mono); white-space:pre-wrap; overflow-wrap:anywhere; }

  #toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); z-index:20; max-width:calc(100vw - 32px); padding:10px 14px; border-radius:10px; background:var(--ink); color:#fff; font-size:13px; box-shadow:0 8px 24px rgba(16,24,40,.2); }

  .login { max-width:360px; margin:15vh auto; padding:20px; display:grid; gap:12px; }
  .login .logo { width:40px; height:40px; --logo-bg:var(--surface); }

  /* mobile: agent list and agent page are separate screens (#/ and #/a/<name>/<tab>) */
  @media (max-width: 760px) {
    .app { grid-template-columns:minmax(0, 1fr); }
    .app:not(.in-agent) .page, .app.in-agent .side { display:none; }
    .side { padding:0; gap:0; background:var(--surface); border:0; }
    .brand { padding:24px 20px 14px; font-size:24px; letter-spacing:-0.02em; }
    .brand .logo { width:30px; height:30px; --logo-bg:var(--surface); }
    #btnNewAgent { display:none; }
    #btnNewAgentM { display:grid; width:40px; height:40px; border-radius:10px; background:var(--ink); border-color:var(--ink); color:#fff; font-size:20px; }
    #agents { gap:0; }
    #agents a, #agents a.sel { gap:12px; padding:14px 20px; border:0; border-bottom:1px solid var(--line2); border-radius:0; background:none; }
    #agents .avatar { width:40px; height:40px; border-radius:9px; font-size:12px; }
    #agents .name, #agents a.sel .name { font-size:15px; font-weight:500; }
    #agents .desc { display:block; font-size:13px; color:var(--faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    #agents .txt > .meta { display:none; }
    #agents .right .meta { display:block; }
    #agents .dot { width:8px; height:8px; }

    .ahead { padding:12px 8px 0; }
    .ahead-row { gap:4px; }
    #btnBack { display:grid; width:44px; height:44px; border:0; font-size:20px; }
    .ahead .avatar, #curDesc, .active-box { display:none; }
    #curName { font-size:17px; }
    #btnMenu { width:44px; height:44px; border:0; font-size:18px; }
    .tabs { gap:20px; margin-top:4px; padding:0 8px; overflow-x:auto; white-space:nowrap; }
    .tabs a { padding:12px 0 10px; }
    #log { padding:16px 16px 8px; }
    #log .col { gap:18px; }
    .m-user { max-width:84%; font-size:15px; }
    .m-agent { font-size:15px; }
    .composer-wrap { padding:10px 12px 16px; border-top:1px solid var(--line2); }
    .scroll { padding:18px 16px; }
    .job { padding:14px; }
    .jobs-head { flex-wrap:wrap; }
    .adv { grid-template-columns:1fr; }
    dialog { width:100vw; max-width:100vw; margin:auto 0 0; border-radius:20px 20px 0 0; }
    dialog form, dialog .dbody { padding:16px 20px 28px; }
    dialog .actions { flex-wrap:wrap; }
  }
</style>
</head>
<body>
<!-- Logo from robot_01.svg, cropped viewBox; black -> currentColor and white -> --logo-bg so it follows the theme. -->
<svg style="position:absolute; width:0; height:0" aria-hidden="true">
  <symbol id="logo" viewBox="440 60 656 562">
    <g style="fill:currentColor">
      <circle cx="768" cy="105" r="35"/>
      <rect x="757" y="132" width="22" height="63"/>
      <path d="M701 230 A67 67 0 0 1 835 230 Z"/>
      <path d="M495 310 H479 Q449 310 449 340 V414 Q449 444 479 444 H495 Z"/>
      <path d="M1041 310 H1057 Q1087 310 1087 340 V414 Q1087 444 1057 444 H1041 Z"/>
      <rect x="505" y="223" width="526" height="302" rx="83"/>
      <rect x="529" y="247" width="478" height="254" rx="60" style="fill:var(--logo-bg, #fff)"/>
      <circle cx="657" cy="379" r="85"/>
      <circle cx="883" cy="379" r="85"/>
      <rect x="703" y="512" width="130" height="34"/>
      <path d="M674 558 H862 Q876 558 883 573 L897 602 Q901 613 889 613 H648 Q635 613 640 601 L653 573 Q659 558 674 558 Z"/>
    </g>
    <g style="fill:var(--logo-bg, #fff)">
      <path fill-rule="evenodd" d="M657 333 C635 333 622 352 622 379 C622 408 634 427 657 427 C680 427 693 408 693 379 C693 352 680 333 657 333 Z M657 353 C649 353 646 362 646 379 C646 397 649 407 657 407 C665 407 669 397 669 379 C669 362 665 353 657 353 Z"/>
      <path d="M874 336 H897 V411 H914 V427 H854 V411 H873 V361 L856 372 V352 Z"/>
    </g>
  </symbol>
</svg>

<form class="login" id="login" hidden>
  <svg class="logo" aria-hidden="true"><use href="#logo"/></svg>
  <b>ProtoBot</b>
  <input id="token" type="password" placeholder="WEB_TOKEN" autocomplete="current-password">
  <button class="btn primary">Sign in</button>
  <div class="err" id="loginErr"></div>
</form>

<div class="app" id="app" hidden>
  <aside class="side">
    <div class="brand">
      <svg class="logo" aria-hidden="true"><use href="#logo"/></svg>
      <span class="grow">ProtoBot</span>
      <button class="icon-btn" id="btnNewAgentM" aria-label="New agent">+</button>
    </div>
    <button class="btn primary" id="btnNewAgent">New agent</button>
    <ul id="agents"></ul>
  </aside>

  <main class="page">
    <header class="ahead">
      <div class="ahead-row">
        <button class="icon-btn" id="btnBack" aria-label="All agents">&larr;</button>
        <span class="avatar" id="curAvatar"></span>
        <div class="title"><span id="curName"></span><span id="curDesc"></span></div>
        <span class="busy-pill" id="busyPill" hidden><span class="dot busy"></span><span id="busyText">Working</span></span>
        <div class="active-box"><button class="switch" role="switch" id="swActive" aria-label="Active (jobs run on schedule)"></button><span id="activeLabel">Active</span></div>
        <div class="menu-wrap">
          <button class="icon-btn" id="btnMenu" aria-label="More" aria-haspopup="menu" aria-expanded="false">&#8943;</button>
          <div class="menu" id="menu" role="menu" hidden>
            <button role="menuitem" id="miNew">New session<small>Save state to memory, start fresh</small></button>
            <button role="menuitem" id="miStop">Stop<small>Kill the running reply</small></button>
          </div>
        </div>
      </div>
      <nav class="tabs" id="tabs">
        <a data-tab="chat">Chat</a>
        <a data-tab="setup">Setup</a>
        <a data-tab="jobs">Jobs<span class="meta" id="jobsCount"></span></a>
      </nav>
    </header>

    <section class="tab" id="tab-chat">
      <div id="log"><div class="col" id="logCol"></div></div>
      <div class="composer-wrap"><div class="col">
        <form class="composer" id="sendForm">
          <textarea id="text" rows="1" placeholder="Message"></textarea>
          <div class="composer-row">
            <span class="meta" id="chatMeta"></span>
            <span style="display:flex; gap:8px; align-items:center">
              <button type="button" class="btn" id="btnStop" hidden>Stop</button>
              <button class="send" aria-label="Send (Ctrl+Enter)" title="Send (Ctrl+Enter)">&uarr;</button>
            </span>
          </div>
        </form>
      </div></div>
    </section>

    <section class="tab" id="tab-setup" hidden>
      <div class="scroll"><div class="stack">
        <div class="card card-row">
          <div class="txt"><b id="setName"></b><span id="setDesc"></span></div>
          <button class="switch" role="switch" id="swActive2" aria-label="Active (jobs run on schedule)"></button>
        </div>
        <div class="section">
          <div class="section-head"><b>System prompt</b><span class="meta" id="promptState"></span></div>
          <textarea id="prompt" spellcheck="false"></textarea>
          <div class="section-head" id="promptActions" hidden>
            <span class="err" id="promptErr"></span>
            <span style="display:flex; gap:8px; margin-left:auto"><button class="btn" id="promptReset">Discard</button><button class="btn primary" id="promptSave">Save</button></span>
          </div>
        </div>
        <div class="section">
          <div class="section-head"><b>Rules</b><span class="meta" id="rulesCount"></span></div>
          <div class="card rules">
            <div id="rulesList"></div>
            <form class="rule-add" id="ruleForm">
              <button type="button" class="link" id="ruleAddBtn">+ Add rule</button>
              <input type="text" id="ruleText" placeholder="New rule, Enter to add" hidden>
            </form>
          </div>
          <span class="err" id="rulesErr"></span>
        </div>
        <div class="card">
          <details class="row" id="dKnowledge">
            <summary><span class="grow">Knowledge</span><span class="meta" id="knowCount"></span><span class="chev">&rsaquo;</span></summary>
            <div class="files" id="knowList"></div>
          </details>
          <details class="row" id="dMemory">
            <summary><span class="grow">Memory</span><span class="meta" id="memCount"></span><span class="chev">&rsaquo;</span></summary>
            <div class="files" id="memList"></div>
          </details>
          <details class="row" id="dAdvanced">
            <summary><span class="grow">Advanced</span><span class="meta">Model &middot; limits</span><span class="chev">&rsaquo;</span></summary>
            <form class="adv" id="advForm">
              <label>Model<input type="text" id="advModel" placeholder="default"></label>
              <label>Max turns per session<input type="number" id="advTurns" min="0" placeholder="default"></label>
              <span class="meta full" id="advSession"></span>
              <div class="actions"><button class="btn">Save</button><span class="meta" id="advState"></span><span class="err" id="advErr"></span></div>
            </form>
          </details>
        </div>
        <div><button class="link bad" id="btnDelete">Delete agent</button></div>
      </div></div>
    </section>

    <section class="tab" id="tab-jobs" hidden>
      <div class="scroll"><div class="stack" style="max-width:860px; gap:14px">
        <div class="jobs-head">
          <div style="display:flex; flex-direction:column; gap:4px"><b>Recurring jobs</b><span>Jobs run on a schedule in a fresh session and post their results to this agent's chat.</span></div>
          <button class="btn primary" id="btnNewJob">New job</button>
        </div>
        <div id="jobsList" style="display:flex; flex-direction:column; gap:14px"></div>
      </div></div>
    </section>
  </main>
</div>

<dialog id="dlgNew">
  <form id="newForm">
    <h2>New agent</h2>
    <label class="f">Name<input type="text" id="newName" placeholder="e.g. research" required autocomplete="off"></label>
    <label class="f">Role<span class="hint">What this agent is for and how it should work. Becomes its system prompt.</span><textarea id="newRole" rows="4" required></textarea></label>
    <div class="err" id="newErr"></div>
    <div class="actions"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary">Create agent</button></div>
  </form>
</dialog>

<dialog id="dlgDelete">
  <div class="dbody">
    <h2 id="delTitle"></h2>
    <p id="delText"></p>
    <div class="err" id="delErr"></div>
    <div class="actions"><button class="btn" data-close>Cancel</button><button class="btn danger" id="delConfirm">Delete agent</button></div>
  </div>
</dialog>

<dialog id="dlgJob">
  <form id="jobForm">
    <h2 id="jobTitle">New job</h2>
    <label class="f">ID<span class="hint">Lowercase letters, digits and '-'.</span><input type="text" id="jobId" required autocomplete="off" placeholder="morning-digest"></label>
    <div class="seg" role="radiogroup" aria-label="Schedule">
      <label><input type="radio" name="jtype" value="daily" checked><span>Daily</span></label>
      <label><input type="radio" name="jtype" value="every"><span>Interval</span></label>
      <label><input type="radio" name="jtype" value="once"><span>Once</span></label>
    </div>
    <div id="fDaily" style="display:flex; flex-direction:column; gap:10px">
      <label class="f">Time<input type="time" id="jobTime" value="08:00"></label>
      <div class="days" id="jobDays" aria-label="Days (none = every day)"></div>
    </div>
    <label class="f" id="fEvery" hidden>Every (minutes)<input type="number" id="jobMinutes" min="1" value="60"></label>
    <label class="f" id="fOnce" hidden>At<input type="datetime-local" id="jobAt"></label>
    <label class="f">Prompt<span class="hint">Self-contained: the job runs without chat history. Say what to report.</span><textarea id="jobPrompt" required></textarea></label>
    <label class="check"><input type="checkbox" id="jobEnabled" checked> Enabled</label>
    <div class="err" id="jobErr"></div>
    <div class="actions">
      <button type="button" class="link bad left" id="jobDelete">Delete job</button>
      <button type="button" class="btn" data-close>Cancel</button><button class="btn primary">Save</button>
    </div>
  </form>
</dialog>

<dialog id="dlgFile">
  <div class="dbody">
    <div class="section-head"><h2 id="fileTitle" class="mono" style="font-size:14px"></h2><button class="link" data-close>Close</button></div>
    <pre id="fileText"></pre>
  </div>
</dialog>

<div id="toast" role="status" hidden></div>

<script>
const $ = id => document.getElementById(id);
const enc = encodeURIComponent;
const MOBILE = matchMedia("(max-width: 760px)");
const DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
const DAY_NAMES = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

let token = "", current = "main", tab = "chat", lastIndex = 0, agentsCache = [], setupData = null, jobsData = [];
try { token = localStorage.getItem("pb_token") || ""; current = localStorage.getItem("pb_agent") || "main"; } catch (e) {}

// --- helpers -----------------------------------------------------------------
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e[k] = v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c);
  return e;
}

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { "Content-Type": "application/json", "X-Token": token, ...(opts.headers || {}) } });
  if (r.status === 401) { showLogin("Invalid token"); throw new Error("401"); }
  const data = r.headers.get("content-type")?.includes("json") ? await r.json() : null;
  if (!r.ok) throw new Error(typeof data?.detail === "string" ? data.detail : r.statusText);
  return data;
}
const post = (path, body, method = "POST") => api(path, { method, body: body === undefined ? undefined : JSON.stringify(body) });
const agentUrl = (name = current) => `/api/agents/${enc(name)}`;

let toastTimer;
function toast(msg) {
  $("toast").textContent = msg; $("toast").hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { $("toast").hidden = true; }, 5000);
}

const initials = name => { const p = name.split("-").filter(Boolean); return (p.length > 1 ? p[0][0] + p[1][0] : name.slice(0, 2)); };
const firstLine = s => (s || "").split("\n").find(l => l.trim()) || "";
const describe = a => a.name === "main" ? "Main agent · Telegram + web" : firstLine(a.role);
const jobsLabel = n => n ? `${n} job${n > 1 ? "s" : ""}` : "No jobs";
const pad = n => String(n).padStart(2, "0");

function fmtWhen(iso) {
  if (!iso) return "—";
  const d = new Date(iso), now = new Date(), hm = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const day = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((day(d) - day(now)) / 86400000);
  if (diff === 0) return `Today ${hm}`;
  if (diff === 1) return `Tomorrow ${hm}`;
  if (diff === -1) return `Yesterday ${hm}`;
  return `${MONTHS[d.getMonth()]} ${d.getDate()}${d.getFullYear() !== now.getFullYear() ? " " + d.getFullYear() : ""} ${hm}`;
}
function fmtMsgTime(iso) { const s = fmtWhen(iso); return s.startsWith("Today ") ? s.slice(6) : s; }

function describeSchedule(s = {}) {
  if (s.type === "once") return `Once, ${fmtWhen(s.at)}`;
  if (s.type === "every") return s.minutes % 60 === 0 ? `Every ${s.minutes / 60} h` : `Every ${s.minutes} min`;
  if (s.type === "daily") {
    const d = [...(s.days || [])].sort().join(",");
    if (!d || d === "0,1,2,3,4,5,6") return `Every day at ${s.time}`;
    if (d === "0,1,2,3,4") return `Every weekday at ${s.time}`;
    if (d === "5,6") return `Weekends at ${s.time}`;
    if (s.days.length === 1) return `Every ${DAY_NAMES[s.days[0]] ?? s.days[0]} at ${s.time}`;
    return `${s.days.map(x => DAYS[x] ?? x).join(", ")} at ${s.time}`;
  }
  return JSON.stringify(s);
}

function setSwitch(btn, on) { btn.setAttribute("aria-checked", on ? "true" : "false"); }

// --- login -------------------------------------------------------------------
function showLogin(msg = "") { $("app").hidden = true; $("login").hidden = false; $("loginErr").textContent = msg; }

$("login").onsubmit = async e => {
  e.preventDefault();
  token = $("token").value.trim();
  try { await api("/api/agents"); } catch (err) { return; }
  try { localStorage.setItem("pb_token", token); } catch (e) {}
  $("login").hidden = true; $("app").hidden = false;
  start();
};

// --- routing: #/ (agent list, mobile only) and #/a/<name>/<chat|setup|jobs> ----
function parseHash() {
  const m = location.hash.match(/^#\/a\/([^/]+)(?:\/(chat|setup|jobs))?$/);
  return m ? { name: decodeURIComponent(m[1]), tab: m[2] || "chat" } : null;
}
const href = (name, t = "chat") => `#/a/${enc(name)}/${t}`;
function go(name, t = "chat") { location.hash = href(name, t); }

function route() {
  const r = parseHash();
  if (!r || !agentsCache.some(a => a.name === r.name)) {
    if (!MOBILE.matches || r) { location.replace(href(agentsCache.some(a => a.name === current) ? current : "main")); return; }
    $("app").classList.remove("in-agent");
    renderAgents();
    return;
  }
  $("app").classList.add("in-agent");
  if (r.name !== current) switchAgent(r.name);
  tab = r.tab;
  for (const t of ["chat", "setup", "jobs"]) $("tab-" + t).hidden = t !== tab;
  for (const a of $("tabs").children) a.classList.toggle("on", a.dataset.tab === tab);
  closeMenu();
  renderAgents();
  if (tab === "chat") { refreshMessages().catch(() => {}); $("log").scrollTop = $("log").scrollHeight; }
  if (tab === "setup") loadSetup().catch(err => toast(err.message));
  if (tab === "jobs") refreshJobs().catch(err => toast(err.message));
}

function switchAgent(name) {
  current = name; lastIndex = 0; setupData = null; jobsData = []; promptDirty = false;
  $("logCol").replaceChildren(); $("jobsList").replaceChildren(); $("text").value = "";
  try { localStorage.setItem("pb_agent", name); } catch (e) {}
}

window.onhashchange = route;
MOBILE.onchange = route;
$("btnBack").onclick = () => { location.hash = "#/"; };

// --- agents list and header ---------------------------------------------------
async function refreshAgents() { agentsCache = await api("/api/agents"); renderAgents(); }

function renderAgents() {
  const ul = $("agents"); ul.replaceChildren();
  for (const a of agentsCache) {
    const dotCls = "dot" + (a.busy || a.jobs.length ? " busy" : a.paused ? " paused" : "");
    ul.append(h("li", {}, h("a", { href: href(a.name, a.name === current ? tab : "chat"), class: a.name === current ? "sel" : "" },
      h("span", { class: "avatar", text: initials(a.name) }),
      h("span", { class: "txt" }, h("span", { class: "name", text: a.name }), h("span", { class: "desc", text: describe(a) }),
        h("span", { class: "meta", text: jobsLabel(a.job_count) })),
      h("span", { class: "right" }, h("span", { class: dotCls, title: a.busy ? "Working" : a.paused ? "Paused" : "Active" }),
        h("span", { class: "meta", text: jobsLabel(a.job_count) })))));
  }
  renderHeader();
}

function renderHeader() {
  const a = agentsCache.find(x => x.name === current);
  if (!a) return;
  $("curAvatar").textContent = initials(a.name);
  $("curName").textContent = a.name;
  $("curDesc").textContent = describe(a);
  $("setName").textContent = a.name;
  $("setDesc").textContent = describe(a);
  for (const sw of [$("swActive"), $("swActive2")]) setSwitch(sw, !a.paused);
  $("activeLabel").textContent = a.paused ? "Paused" : "Active";
  const working = a.busy || a.jobs.length > 0;
  $("busyPill").hidden = !working;
  $("busyText").textContent = a.busy ? "Working" : `Job: ${a.jobs.join(", ")}`;
  $("jobsCount").textContent = a.job_count || "";
  $("btnStop").hidden = !a.busy;
  $("miStop").disabled = !a.busy;
  $("text").placeholder = `Message ${a.name}`;
  $("chatMeta").textContent = (a.busy ? "working… · " : "") + (a.queue ? `queue ${a.queue} · ` : "")
    + `turns ${a.turns}/${a.max_turns}` + (a.model ? ` · ${a.model}` : "");
  $("btnDelete").hidden = a.name === "main";
}

async function togglePause() {
  const a = agentsCache.find(x => x.name === current);
  if (!a) return;
  try {
    await post(agentUrl(), { paused: !a.paused }, "PATCH");
    await refreshAgents();
    if (tab === "jobs") await refreshJobs();
  } catch (err) { toast(err.message); }
}
$("swActive").onclick = $("swActive2").onclick = togglePause;

// "more" menu
function closeMenu() { $("menu").hidden = true; $("btnMenu").setAttribute("aria-expanded", "false"); }
$("btnMenu").onclick = e => { e.stopPropagation(); const open = $("menu").hidden; $("menu").hidden = !open; $("btnMenu").setAttribute("aria-expanded", String(open)); };
document.addEventListener("click", e => { if (!$("menu").contains(e.target)) closeMenu(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeMenu(); });
$("miNew").onclick = () => { closeMenu(); post(`${agentUrl()}/new`).then(refreshAgents).catch(err => toast(err.message)); };
const stopAgent = () => post(`${agentUrl()}/stop`).then(refreshAgents).catch(err => toast(err.message));
$("miStop").onclick = () => { closeMenu(); stopAgent(); };
$("btnStop").onclick = stopAgent;

// --- chat ---------------------------------------------------------------------
function renderMessage(m) {
  const name = current;
  if (m.role === "user") return h("div", { class: "m-user", text: m.text });
  if (m.role === "system") return h("div", { class: "m-system", text: m.text });
  if (m.role === "job") {
    const match = m.text.match(/^\[([^\]]+)\]\s*/);  // core stores job reports as "[job-id] text"
    return h("div", { class: "m-job" },
      h("div", { class: "jh" }, h("span", { text: `Job · ${match ? match[1] : "?"}` }), h("span", { text: fmtMsgTime(m.ts) })),
      h("div", { class: "body", text: match ? m.text.slice(match[0].length) : m.text }));
  }
  return h("div", { class: "m-agent" },
    h("span", { class: "meta", text: `${name} · ${fmtMsgTime(m.ts)}` + (m.channel === "telegram" ? " · Telegram" : "") }),
    h("span", { class: "body", text: m.text }));
}

async function refreshMessages() {
  const name = current;
  const list = await api(`${agentUrl(name)}/messages?after=${lastIndex}`);
  if (name !== current) return;
  const log = $("log"), col = $("logCol");
  if (!list.length) {
    if (lastIndex === 0 && !col.childElementCount) col.append(h("div", { class: "empty", text: "No messages yet." }));
    return;
  }
  const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
  if (lastIndex === 0) col.replaceChildren();
  list.forEach(m => col.append(renderMessage(m)));
  const first = lastIndex === 0;
  lastIndex = list[list.length - 1].i;
  if (atBottom || first) log.scrollTop = log.scrollHeight;
}

$("sendForm").onsubmit = async e => {
  e.preventDefault();
  const text = $("text").value.trim();
  if (!text) return;
  $("text").value = ""; autoGrow();
  try {
    await post(`${agentUrl()}/messages`, { text });
    await refreshMessages(); $("log").scrollTop = $("log").scrollHeight;
    refreshAgents();
  } catch (err) { $("text").value = text; toast(err.message); }
};
function autoGrow() { const t = $("text"); t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; }
$("text").oninput = autoGrow;
$("text").onkeydown = e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) $("sendForm").requestSubmit(); };

// --- setup --------------------------------------------------------------------
let promptDirty = false;

async function loadSetup() {
  const name = current;
  const s = await api(`${agentUrl(name)}/setup`);
  if (name !== current) return;
  setupData = s;
  renderSetup();
}

function renderSetup() {
  const s = setupData;
  if (!s) return;
  const p = $("prompt");
  p.readOnly = !s.role_editable;
  if (!promptDirty) p.value = s.role_editable ? s.role : "Defined in agent/CLAUDE.md (part of the bot code). Edit that file to change the main agent's behavior.";
  $("promptState").textContent = s.role_editable ? (promptDirty ? "Unsaved changes" : "Saved") : "Read-only";
  $("promptActions").hidden = !promptDirty;

  $("rulesCount").textContent = s.rules.length;
  $("rulesList").replaceChildren(...s.rules.map((t, i) => h("div", { class: "rule" },
    h("span", { class: "n", text: pad(i + 1) }), h("span", { class: "t", text: t }),
    h("button", { class: "x", "aria-label": "Delete rule", title: "Delete rule", text: "×", onclick: () => deleteRule(t) }))));
  if (!s.rules.length) $("rulesList").append(h("div", { class: "rule" }, h("span", { class: "t", style: "color:var(--faint)", text: "No rules yet. The agent also adds rules here after corrections." })));

  const files = (list, el, countEl, emptyText) => {
    countEl.textContent = list.length ? `${list.length} file${list.length > 1 ? "s" : ""}` : "Empty";
    el.replaceChildren(...list.map(f => h("button", { onclick: () => openFile(f.path) },
      h("span", { text: f.path }), h("span", { class: "meta", text: f.size < 1024 ? `${f.size} B` : `${(f.size / 1024).toFixed(1)} KB` }))));
    if (!list.length) el.append(h("span", { class: "meta", style: "padding:6px 8px", text: emptyText }));
  };
  files(s.knowledge, $("knowList"), $("knowCount"), "No files in memory/knowledge/ yet.");
  files(s.memory, $("memList"), $("memCount"), "No memory files.");

  $("advModel").placeholder = s.default_model || "Claude Code default";
  $("advTurns").placeholder = `default (${s.default_max_turns})`;
  if (document.activeElement !== $("advModel")) $("advModel").value = s.model || "";
  if (document.activeElement !== $("advTurns")) $("advTurns").value = s.max_turns || "";
  const a = agentsCache.find(x => x.name === current);
  $("advSession").textContent = a ? `Session ${a.session || "none"} · turns ${a.turns}/${a.max_turns}, then state is saved and a fresh session starts` : "";
}

$("prompt").oninput = () => { if ($("prompt").readOnly) return; promptDirty = true; $("promptState").textContent = "Unsaved changes"; $("promptActions").hidden = false; };
$("promptReset").onclick = () => { promptDirty = false; $("promptErr").textContent = ""; renderSetup(); };
$("promptSave").onclick = async () => {
  $("promptErr").textContent = "";
  try {
    await post(agentUrl(), { role: $("prompt").value }, "PATCH");
    promptDirty = false;
    await Promise.all([refreshAgents(), loadSetup()]);
  } catch (err) { $("promptErr").textContent = err.message; }
};

$("ruleAddBtn").onclick = () => { $("ruleAddBtn").hidden = true; $("ruleText").hidden = false; $("ruleText").focus(); };
$("ruleText").onkeydown = e => { if (e.key === "Escape") { $("ruleText").value = ""; $("ruleText").hidden = true; $("ruleAddBtn").hidden = false; } };
$("ruleText").onblur = () => { if (!$("ruleText").value.trim()) { $("ruleText").hidden = true; $("ruleAddBtn").hidden = false; } };
$("ruleForm").onsubmit = async e => {
  e.preventDefault();
  $("rulesErr").textContent = "";
  try {
    setupData.rules = await post(`${agentUrl()}/rules`, { text: $("ruleText").value });
    $("ruleText").value = ""; renderSetup(); $("ruleText").focus();
  } catch (err) { $("rulesErr").textContent = err.message; }
};
async function deleteRule(text) {
  $("rulesErr").textContent = "";
  try { setupData.rules = await post(`${agentUrl()}/rules/delete`, { text }); renderSetup(); }
  catch (err) { $("rulesErr").textContent = err.message; loadSetup().catch(() => {}); }
}

$("advForm").onsubmit = async e => {
  e.preventDefault();
  $("advErr").textContent = ""; $("advState").textContent = "";
  try {
    await post(agentUrl(), { model: $("advModel").value, max_turns: Number($("advTurns").value || 0) }, "PATCH");
    await Promise.all([refreshAgents(), loadSetup()]);
    $("advState").textContent = "Saved";
  } catch (err) { $("advErr").textContent = err.message; }
};

async function openFile(path) {
  try {
    const f = await api(`${agentUrl()}/memory?path=${enc(path)}`);
    $("fileTitle").textContent = "memory/" + f.path;
    $("fileText").textContent = f.text;
    $("dlgFile").showModal();
  } catch (err) { toast(err.message); }
}

// --- dialogs ------------------------------------------------------------------
for (const btn of document.querySelectorAll("[data-close]")) btn.onclick = () => btn.closest("dialog").close();
for (const dlg of document.querySelectorAll("dialog")) dlg.onclick = e => { if (e.target === dlg) dlg.close(); };  // backdrop

const openNewAgent = () => { $("newErr").textContent = ""; $("dlgNew").showModal(); $("newName").focus(); };
$("btnNewAgent").onclick = $("btnNewAgentM").onclick = openNewAgent;
$("newForm").onsubmit = async e => {
  e.preventDefault();
  $("newErr").textContent = "";
  try {
    const a = await post("/api/agents", { name: $("newName").value.trim(), role: $("newRole").value.trim() });
    $("newName").value = ""; $("newRole").value = ""; $("dlgNew").close();
    await refreshAgents(); go(a.name);
  } catch (err) { $("newErr").textContent = err.message; }
};

$("btnDelete").onclick = () => {
  const a = agentsCache.find(x => x.name === current);
  $("delTitle").textContent = `Delete ${current}?`;
  $("delText").textContent = `Its chat, memory, files and ${jobsLabel(a?.job_count).toLowerCase()} are moved to deleted/ on the server and the agent stops.`;
  $("delErr").textContent = "";
  $("dlgDelete").showModal();
};
$("delConfirm").onclick = async () => {
  const name = current;
  $("delErr").textContent = "";
  try {
    await api(agentUrl(name), { method: "DELETE" });
    $("dlgDelete").close();
    await refreshAgents(); go("main");
  } catch (err) {
    $("delErr").textContent = err.message + (err.message === "Method Not Allowed" ? " (restart the dispatcher)" : "");
  }
};

// --- jobs ---------------------------------------------------------------------
async function refreshJobs() {
  const name = current;
  const jobs = await api(`${agentUrl(name)}/jobs`);
  if (name !== current) return;
  jobsData = jobs;
  renderJobs();
}

function renderJobs() {
  const list = $("jobsList");
  const paused = agentsCache.find(x => x.name === current)?.paused;
  list.replaceChildren(...jobsData.map(j => {
    const on = j.enabled !== false;
    const sw = h("button", { class: "switch", role: "switch", "aria-label": `${j.id} enabled`, onclick: () => saveJob({ ...j, enabled: !on }, j.id).catch(err => toast(err.message)) });
    setSwitch(sw, on);
    const next = !on ? "Off" : paused ? "Agent paused" : !j.next_run ? "—" : new Date(j.next_run) <= new Date() ? "Due now" : fmtWhen(j.next_run);
    return h("div", { class: "job" + (on ? "" : " off") },
      h("div", { class: "top" },
        h("div", { class: "txt" }, h("b", { text: j.id ?? "(no id)" }), h("span", { class: "when", text: describeSchedule(j.schedule) })),
        h("div", { class: "ctl" },
          h("button", { class: "btn", disabled: j.running, onclick: () => runJob(j.id) },
            j.running ? null : h("span", { class: "play" }), j.running ? "Running…" : "Run now"),
          sw)),
      h("div", { class: "prompt", text: j.prompt ?? "" }),
      h("div", { class: "foot" },
        h("span", { class: "meta", text: `Last run ${j.last_run ? fmtWhen(j.last_run) : "never"}` }),
        h("span", { class: "meta", text: `Next ${next}` }),
        h("button", { class: "link", text: "Edit", onclick: () => openJob(j) })));
  }));
  if (!jobsData.length) list.append(h("div", { class: "card", style: "padding:24px; text-align:center; color:var(--faint); font-size:13.5px",
    text: "No jobs yet. Create one here, or ask the agent in chat, e.g. \"every weekday at 8:00 send me a news digest\"." }));
}

async function saveJob(job, oldId) {
  const body = { id: job.id, enabled: job.enabled !== false, schedule: job.schedule, prompt: job.prompt };
  if (oldId) await post(`${agentUrl()}/jobs/${enc(oldId)}`, body, "PUT");
  else await post(`${agentUrl()}/jobs`, body);
  await Promise.all([refreshJobs(), refreshAgents()]);
}

async function runJob(jid) {
  try { await post(`${agentUrl()}/jobs/${enc(jid)}/run`); toast(`Started ${jid}. The report will appear in Chat.`); }
  catch (err) { toast(err.message); }
  await Promise.all([refreshJobs(), refreshAgents()]).catch(() => {});
}

// job editor
$("jobDays").append(...DAYS.map((d, i) => h("label", {}, h("input", { type: "checkbox", value: i }), h("span", { text: d }))));
let editingJob = null, jobDeleteArmed = false;
function showJobType() {
  const t = document.querySelector("input[name=jtype]:checked").value;
  $("fDaily").hidden = t !== "daily"; $("fEvery").hidden = t !== "every"; $("fOnce").hidden = t !== "once";
}
for (const r of document.querySelectorAll("input[name=jtype]")) r.onchange = showJobType;

function openJob(job) {
  editingJob = job || null;
  const s = job?.schedule || { type: "daily", time: "08:00" };
  $("jobTitle").textContent = job ? `Edit ${job.id}` : "New job";
  $("jobId").value = job?.id || "";
  document.querySelector(`input[name=jtype][value=${["daily", "every", "once"].includes(s.type) ? s.type : "daily"}]`).checked = true;
  $("jobTime").value = s.time || "08:00";
  for (const c of $("jobDays").querySelectorAll("input")) c.checked = (s.days || []).includes(Number(c.value));
  $("jobMinutes").value = s.minutes || 60;
  const t = new Date(Date.now() + 3600000);
  $("jobAt").value = s.at ? String(s.at).slice(0, 16) : `${t.getFullYear()}-${pad(t.getMonth() + 1)}-${pad(t.getDate())}T${pad(t.getHours())}:00`;
  $("jobPrompt").value = job?.prompt || "";
  $("jobEnabled").checked = job ? job.enabled !== false : true;
  $("jobErr").textContent = "";
  $("jobDelete").hidden = !job; jobDeleteArmed = false; $("jobDelete").textContent = "Delete job";
  showJobType();
  $("dlgJob").showModal();
}
$("btnNewJob").onclick = () => openJob(null);

$("jobForm").onsubmit = async e => {
  e.preventDefault();
  const type = document.querySelector("input[name=jtype]:checked").value;
  const schedule = type === "daily"
    ? { type, time: $("jobTime").value, days: [...$("jobDays").querySelectorAll("input:checked")].map(c => Number(c.value)) }
    : type === "every" ? { type, minutes: Number($("jobMinutes").value) } : { type, at: $("jobAt").value };
  const job = { id: $("jobId").value.trim(), enabled: $("jobEnabled").checked, schedule, prompt: $("jobPrompt").value };
  $("jobErr").textContent = "";
  try { await saveJob(job, editingJob?.id); $("dlgJob").close(); }
  catch (err) { $("jobErr").textContent = err.message; }
};

// Two clicks instead of confirm(): embedded browsers may block dialogs, which makes confirm() return false silently.
$("jobDelete").onclick = async () => {
  if (!jobDeleteArmed) { jobDeleteArmed = true; $("jobDelete").textContent = `Confirm delete ${editingJob.id}?`; return; }
  try {
    await api(`${agentUrl()}/jobs/${enc(editingJob.id)}`, { method: "DELETE" });
    $("dlgJob").close();
    await Promise.all([refreshJobs(), refreshAgents()]);
  } catch (err) { $("jobErr").textContent = err.message; }
};

// --- start / polling ----------------------------------------------------------
for (const a of $("tabs").children) a.onclick = e => { e.preventDefault(); go(current, a.dataset.tab); };

let timer;
async function start() {
  await refreshAgents();
  route();
  clearInterval(timer);
  timer = setInterval(() => {
    refreshAgents().catch(() => {});
    if (!$("app").classList.contains("in-agent") && MOBILE.matches) return;
    if (tab === "chat") refreshMessages().catch(() => {});
    if (tab === "jobs" && !$("dlgJob").open) refreshJobs().catch(() => {});
  }, 2000);
}

if (token) { $("app").hidden = false; start().catch(() => {}); } else { showLogin(); }
</script>
</body>
</html>
