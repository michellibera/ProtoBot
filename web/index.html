<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProtoBot</title>
<!-- Same robot as the #logo symbol; data URI because the server serves no static files. Colors follow the OS theme. -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='440 60 656 562'%3E%3Cstyle%3E.f%7Bfill:%231d1d1b%7D.b%7Bfill:%23fff%7D@media (prefers-color-scheme:dark)%7B.f%7Bfill:%23ececea%7D.b%7Bfill:%231f1f1d%7D%7D%3C/style%3E%3Cg class='f'%3E%3Ccircle cx='768' cy='105' r='35'/%3E%3Crect x='757' y='132' width='22' height='63'/%3E%3Cpath d='M701 230 A67 67 0 0 1 835 230 Z'/%3E%3Cpath d='M495 310 H479 Q449 310 449 340 V414 Q449 444 479 444 H495 Z'/%3E%3Cpath d='M1041 310 H1057 Q1087 310 1087 340 V414 Q1087 444 1057 444 H1041 Z'/%3E%3Crect x='505' y='223' width='526' height='302' rx='83'/%3E%3C/g%3E%3Crect class='b' x='529' y='247' width='478' height='254' rx='60'/%3E%3Cg class='f'%3E%3Ccircle cx='657' cy='379' r='85'/%3E%3Ccircle cx='883' cy='379' r='85'/%3E%3Crect x='703' y='512' width='130' height='34'/%3E%3Cpath d='M674 558 H862 Q876 558 883 573 L897 602 Q901 613 889 613 H648 Q635 613 640 601 L653 573 Q659 558 674 558 Z'/%3E%3C/g%3E%3Cg class='b'%3E%3Cpath fill-rule='evenodd' d='M657 333 C635 333 622 352 622 379 C622 408 634 427 657 427 C680 427 693 408 693 379 C693 352 680 333 657 333 Z M657 353 C649 353 646 362 646 379 C646 397 649 407 657 407 C665 407 669 397 669 379 C669 362 665 353 657 353 Z'/%3E%3Cpath d='M874 336 H897 V411 H914 V427 H854 V411 H873 V361 L856 372 V352 Z'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root { --bg:#f6f6f4; --surface:#fff; --fg:#1d1d1b; --muted:#6b6b66; --line:#e2e2dc; --accent:#3b5bdb;
          --accent-soft:#e7ecff; --warn:#b7791f; --bad:#c92a2a; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#151514; --surface:#1f1f1d; --fg:#ececea; --muted:#9a9a94; --line:#33332f; --accent:#7c94ff;
            --accent-soft:#25294a; --warn:#e0a850; --bad:#ff6b6b; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  [hidden] { display:none !important; } /* author display rules would otherwise override the hidden attribute */
  body { margin:0; font:14px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  .app { display:grid; grid-template-columns: 240px minmax(0, 1fr); height:100dvh; }
  aside { border-right:1px solid var(--line); background:var(--surface); display:flex; flex-direction:column; min-height:0; }
  aside h1 { font-size:15px; margin:0; padding:14px 16px; border-bottom:1px solid var(--line); display:flex; gap:8px; align-items:center; }
  .logo { width:24px; height:24px; flex:none; --logo-bg:var(--surface); }
  .login .logo { width:40px; height:40px; --logo-bg:var(--bg); }
  #agents { list-style:none; margin:0; padding:6px; overflow:auto; flex:1; }
  #agents li { padding:8px 10px; border-radius:8px; cursor:pointer; display:flex; gap:8px; align-items:center; }
  #agents li:hover { background:var(--bg); }
  #agents li.sel { background:var(--accent-soft); }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--line); flex:none; }
  .dot.busy { background:var(--warn); }
  #agents small { color:var(--muted); display:block; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:170px; }
  details.new { border-top:1px solid var(--line); }
  details.new summary { padding:10px 16px; cursor:pointer; color:var(--accent); }
  details.new form { padding:0 10px 10px; display:grid; gap:6px; }
  main { display:flex; flex-direction:column; min-height:0; min-width:0; }
  header { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  header .title { flex:1; min-width:160px; }
  header .title b { font-size:15px; }
  header .title div { color:var(--muted); font-size:12px; }
  #log { flex:1; overflow:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:min(760px, 92%); padding:9px 12px; border-radius:10px; white-space:pre-wrap; word-wrap:break-word; border:1px solid var(--line); background:var(--surface); }
  .msg.user { align-self:flex-end; background:var(--accent-soft); border-color:transparent; }
  .msg.system { align-self:center; color:var(--muted); font-size:13px; background:transparent; border-style:dashed; }
  .msg .meta { display:block; color:var(--muted); font-size:11px; margin-bottom:3px; }
  form.send { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); background:var(--surface); }
  textarea, input { font:inherit; color:inherit; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px 10px; width:100%; }
  textarea { resize:vertical; min-height:42px; max-height:40vh; }
  button { font:inherit; border:1px solid var(--line); background:var(--surface); color:var(--fg); border-radius:8px; padding:7px 12px; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.danger { color:var(--bad); }
  .err { color:var(--bad); font-size:12px; min-height:1em; }
  #headErr { padding:6px 16px; border-bottom:1px solid var(--line); }
  #jobsPanel { padding:10px 16px; border-bottom:1px solid var(--line); background:var(--surface); max-height:40dvh; overflow:auto; display:grid; gap:8px; }
  .job { border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  .job.off { opacity:.55; }
  .job .head { display:flex; gap:8px; flex-wrap:wrap; align-items:baseline; }
  .job .sched, .job .last { color:var(--muted); font-size:12px; }
  .job .tag { font-size:11px; padding:1px 6px; border-radius:6px; background:var(--bg); color:var(--muted); }
  .job .tag.run { background:var(--warn); color:#fff; }
  .job details { margin-top:4px; font-size:13px; }
  .job details div { white-space:pre-wrap; word-wrap:break-word; color:var(--muted); margin-top:4px; }
  .muted { color:var(--muted); font-size:13px; }
  #status { color:var(--muted); font-size:12px; }
  .login { max-width:360px; margin:15vh auto; padding:20px; display:grid; gap:10px; }
  @media (max-width: 700px) {
    .app { grid-template-columns:minmax(0, 1fr); grid-template-rows:auto minmax(0, 1fr); }
    aside { max-height:45dvh; border-right:0; border-bottom:1px solid var(--line); }
    aside h1 { display:none; }
    #agents { display:flex; gap:4px; overflow-x:auto; flex:none; }
    #agents li { flex:none; }
    #agents small { display:none; }
    header { padding:8px 12px; }
    #log { padding:12px; }
    form.send { padding:8px 12px; }
  }
</style>
</head>
<body>
<!-- Logo from robot_01.svg, cropped viewBox; black -> currentColor and white -> --logo-bg so it follows the theme. -->
<svg style="position:absolute; width:0; height:0" aria-hidden="true">
  <symbol id="logo" viewBox="440 60 656 562">
    <g style="fill:currentColor">
      <circle cx="768" cy="105" r="35"/>
      <rect x="757" y="132" width="22" height="63"/>
      <path d="M701 230 A67 67 0 0 1 835 230 Z"/>
      <path d="M495 310 H479 Q449 310 449 340 V414 Q449 444 479 444 H495 Z"/>
      <path d="M1041 310 H1057 Q1087 310 1087 340 V414 Q1087 444 1057 444 H1041 Z"/>
      <rect x="505" y="223" width="526" height="302" rx="83"/>
      <rect x="529" y="247" width="478" height="254" rx="60" style="fill:var(--logo-bg, #fff)"/>
      <circle cx="657" cy="379" r="85"/>
      <circle cx="883" cy="379" r="85"/>
      <rect x="703" y="512" width="130" height="34"/>
      <path d="M674 558 H862 Q876 558 883 573 L897 602 Q901 613 889 613 H648 Q635 613 640 601 L653 573 Q659 558 674 558 Z"/>
    </g>
    <g style="fill:var(--logo-bg, #fff)">
      <path fill-rule="evenodd" d="M657 333 C635 333 622 352 622 379 C622 408 634 427 657 427 C680 427 693 408 693 379 C693 352 680 333 657 333 Z M657 353 C649 353 646 362 646 379 C646 397 649 407 657 407 C665 407 669 397 669 379 C669 362 665 353 657 353 Z"/>
      <path d="M874 336 H897 V411 H914 V427 H854 V411 H873 V361 L856 372 V352 Z"/>
    </g>
  </symbol>
</svg>
<form class="login" id="login" hidden>
  <svg class="logo" aria-hidden="true"><use href="#logo"/></svg>
  <b>ProtoBot</b>
  <input id="token" type="password" placeholder="WEB_TOKEN" autocomplete="current-password">
  <button class="primary">Sign in</button>
  <div class="err" id="loginErr"></div>
</form>

<div class="app" id="app" hidden>
  <aside>
    <h1><svg class="logo" aria-hidden="true"><use href="#logo"/></svg>ProtoBot agents</h1>
    <ul id="agents"></ul>
    <details class="new" id="newBox">
      <summary>+ New agent</summary>
      <form id="newForm">
        <input id="newName" placeholder="name, e.g. research" required>
        <textarea id="newRole" placeholder="role: what this agent is for, how it should work" required></textarea>
        <button class="primary">Create agent</button>
        <div class="err" id="newErr"></div>
      </form>
    </details>
  </aside>
  <main>
    <header>
      <div class="title"><b id="curName"></b><div id="curRole"></div></div>
      <span id="status"></span>
      <button id="btnJobs" title="Scheduled jobs saved by this agent (jobs.json)">Jobs</button>
      <button id="btnNew" title="Save state to memory and start a fresh session">New session</button>
      <button id="btnStop">Stop</button>
      <button id="btnDelete" class="danger" title="Move this agent's files to deleted/ and remove it">Delete</button>
    </header>
    <div class="err" id="headErr" hidden></div>
    <section id="jobsPanel" hidden></section>
    <div id="log"></div>
    <form class="send" id="sendForm">
      <textarea id="text" placeholder="Message (Ctrl+Enter to send)"></textarea>
      <button class="primary">Send</button>
    </form>
  </main>
</div>

<script>
const $ = id => document.getElementById(id);
let token = "", current = "main", lastIndex = 0, agentsCache = [];
try { token = localStorage.getItem("pb_token") || ""; current = localStorage.getItem("pb_agent") || "main"; } catch (e) {}

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { "Content-Type": "application/json", "X-Token": token, ...(opts.headers || {}) } });
  if (r.status === 401) { showLogin("Invalid token"); throw new Error("401"); }
  const data = r.headers.get("content-type")?.includes("json") ? await r.json() : null;
  if (!r.ok) throw new Error(data?.detail || r.statusText);
  return data;
}

function showLogin(msg = "") { $("app").hidden = true; $("login").hidden = false; $("loginErr").textContent = msg; }

$("login").onsubmit = async e => {
  e.preventDefault();
  token = $("token").value.trim();
  try { await api("/api/agents"); } catch (err) { return; }
  try { localStorage.setItem("pb_token", token); } catch (e) {}
  $("login").hidden = true; $("app").hidden = false;
  start();
};

function renderAgents() {
  const ul = $("agents"); ul.replaceChildren();
  for (const a of agentsCache) {
    const li = document.createElement("li");
    li.className = a.name === current ? "sel" : "";
    const dot = document.createElement("span"); dot.className = "dot" + (a.busy ? " busy" : "");
    const box = document.createElement("div");
    const b = document.createElement("b"); b.textContent = a.name;
    const s = document.createElement("small"); s.textContent = a.name === "main" ? "Telegram + web" : a.role;
    box.append(b, s); li.append(dot, box);
    li.onclick = () => select(a.name);
    ul.append(li);
  }
  const a = agentsCache.find(x => x.name === current);
  if (!a) return;
  $("curName").textContent = a.name;
  $("curRole").textContent = a.name === "main" ? "main agent (also on Telegram)" : a.role;
  $("btnDelete").hidden = a.name === "main";
  $("status").textContent = (a.busy ? "working..." : "idle") + (a.queue ? ` | queue ${a.queue}` : "")
    + ` | turns ${a.turns}/${a.max_turns}` + (a.jobs.length ? ` | jobs: ${a.jobs.join(", ")}` : "");
}

function addMessage(m) {
  const div = document.createElement("div");
  div.className = "msg " + (m.role === "job" ? "agent" : m.role);
  const meta = document.createElement("span"); meta.className = "meta";
  meta.textContent = `${m.role} | ${m.channel} | ${m.ts.replace("T", " ")}`;
  div.append(meta, document.createTextNode(m.text));
  $("log").append(div);
}

async function refreshAgents() { agentsCache = await api("/api/agents"); renderAgents(); }

async function refreshMessages() {
  const name = current;
  const list = await api(`/api/agents/${encodeURIComponent(name)}/messages?after=${lastIndex}`);
  if (name !== current || !list.length) return;
  const log = $("log"), atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 60;
  list.forEach(addMessage);
  lastIndex = list[list.length - 1].i;
  if (atBottom || lastIndex === list.length) log.scrollTop = log.scrollHeight;
}

function select(name) {
  current = name; lastIndex = 0; $("log").replaceChildren(); $("headErr").hidden = true; disarmDelete();
  try { localStorage.setItem("pb_agent", name); } catch (e) {}
  renderAgents(); refreshMessages();
  if (!$("jobsPanel").hidden) refreshJobs().catch(() => {});
}

$("sendForm").onsubmit = async e => {
  e.preventDefault();
  const text = $("text").value.trim();
  if (!text) return;
  $("text").value = "";
  await api(`/api/agents/${encodeURIComponent(current)}/messages`, { method: "POST", body: JSON.stringify({ text }) });
  refreshMessages(); refreshAgents();
};
$("text").onkeydown = e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) $("sendForm").requestSubmit(); };
$("btnNew").onclick = () => api(`/api/agents/${encodeURIComponent(current)}/new`, { method: "POST" }).then(refreshAgents);
$("btnStop").onclick = () => api(`/api/agents/${encodeURIComponent(current)}/stop`, { method: "POST" }).then(refreshAgents);

const DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
function describeSchedule(s = {}) {
  if (s.type === "once") return `once at ${String(s.at).replace("T", " ")}`;
  if (s.type === "daily") return `daily at ${s.time}` + (s.days?.length ? ` (${s.days.map(d => DAYS[d] ?? d).join(", ")})` : "");
  if (s.type === "every") return `every ${s.minutes} min`;
  return JSON.stringify(s);
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

async function refreshJobs() {
  const name = current, panel = $("jobsPanel");
  const jobs = await api(`/api/agents/${encodeURIComponent(name)}/jobs`);
  if (name !== current) return;
  const running = agentsCache.find(a => a.name === name)?.jobs || [];
  panel.replaceChildren(el("b", "", `Jobs of ${name} (${jobs.length})`));
  if (!jobs.length) panel.append(el("div", "muted", "No scheduled jobs."));
  for (const j of jobs) {
    const on = j.enabled !== false;
    const box = el("div", "job" + (on ? "" : " off"));
    const head = el("div", "head");
    head.append(el("b", "", j.id ?? "(no id)"), el("span", "tag", on ? "on" : "off"));
    if (running.includes(j.id)) head.append(el("span", "tag run", "running"));
    head.append(el("span", "sched", describeSchedule(j.schedule)),
                el("span", "last", `last run: ${j.last_run ? j.last_run.replace("T", " ") : "-"}`));
    const det = el("details");
    det.append(el("summary", "", "prompt"), el("div", "", j.prompt ?? ""));
    box.append(head, det);
    panel.append(box);
  }
}

$("btnJobs").onclick = () => {
  const panel = $("jobsPanel");
  panel.hidden = !panel.hidden;
  if (!panel.hidden) refreshJobs().catch(err => { panel.replaceChildren(el("div", "err", err.message)); });
};

// Two clicks instead of confirm(): embedded browsers may block dialogs, which makes confirm() return false silently.
let deleteArmed = null, deleteTimer;
function disarmDelete() { deleteArmed = null; clearTimeout(deleteTimer); $("btnDelete").textContent = "Delete"; }

$("btnDelete").onclick = async () => {
  const name = current;
  if (deleteArmed !== name) {
    deleteArmed = name;
    $("btnDelete").textContent = `Confirm delete ${name}?`;
    deleteTimer = setTimeout(disarmDelete, 5000);
    return;
  }
  disarmDelete();
  try {
    await api(`/api/agents/${encodeURIComponent(name)}`, { method: "DELETE" });
    await refreshAgents(); select("main");
  } catch (err) {
    $("headErr").textContent = `Delete failed: ${err.message}` + (err.message === "Method Not Allowed" ? " (restart the dispatcher)" : "");
    $("headErr").hidden = false;
  }
};

$("newForm").onsubmit = async e => {
  e.preventDefault();
  $("newErr").textContent = "";
  try {
    const a = await api("/api/agents", { method: "POST", body: JSON.stringify({ name: $("newName").value.trim(), role: $("newRole").value.trim() }) });
    $("newName").value = ""; $("newRole").value = ""; $("newBox").open = false;
    await refreshAgents(); select(a.name);
  } catch (err) { $("newErr").textContent = err.message; }
};

let timer;
async function start() {
  await refreshAgents();
  if (!agentsCache.some(a => a.name === current)) current = "main";
  select(current);
  clearInterval(timer);
  timer = setInterval(() => { refreshAgents().catch(() => {}); refreshMessages().catch(() => {}); }, 2000);
}

if (token) { $("app").hidden = false; start().catch(() => {}); } else { showLogin(); }
</script>
</body>
</html>
